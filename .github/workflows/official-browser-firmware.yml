name: Official browser firmware

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Emscripten 3.1.74
        run: |
          git clone https://github.com/emscripten-core/emsdk.git .browser-work/emsdk
          .browser-work/emsdk/emsdk install 3.1.74
          .browser-work/emsdk/emsdk activate 3.1.74
      - name: Build latest official Specter firmware
        run: bash browser/build-browser.sh
      - name: Verify official artifact manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          pointer = json.loads(pathlib.Path('browser/current.json').read_text())
          assert re.fullmatch(r'/builds/cryptoadvance/specter-diy/[0-9a-f]{40}/', pointer['build'])
          build = pathlib.Path(pointer['build'].lstrip('/'))
          manifest = json.loads((build / 'build-info.json').read_text())
          assert manifest['repository'] == 'cryptoadvance/specter-diy'
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-rc\d+)?', manifest['firmware_version'])
          assert pointer['version'] == manifest['artifact_set_sha256'][:16]
          for name, expected in manifest['artifacts'].items():
              path = build / name
              assert path.stat().st_size == expected['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected['sha256']
          PY
      - name: Install Specter native test dependencies
        run: pip install -r .browser-work/specter-diy/requirements.txt -r .browser-work/specter-diy/test/integration/requirements.txt
      - name: Run Specter native unit tests
        working-directory: .browser-work/specter-diy/test
        run: python3 run_native_tests.py
      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/specter-static.log 2>&1 &
      - name: Check Android-sized worker stacks
        run: npm run test:native-stack
      - name: Test official browser simulator
        env:
          CI: 'true'
        run: |
          node browser/test-sd-capacity.mjs
          node browser/test-demo-data.mjs
          node browser/test-site.mjs
          node browser/test-source-link.mjs
          node browser/test-qr.mjs
          node browser/test-camera.mjs
          node browser/test-card.mjs
          node browser/test-demo-import.mjs
      - name: Upload tested official browser build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: official-browser-builds
          compression-level: 0
          path: |
            builds/cryptoadvance/specter-diy/**/*.js
            builds/cryptoadvance/specter-diy/**/*.wasm
            builds/cryptoadvance/specter-diy/**/*.data
            builds/cryptoadvance/specter-diy/**/build-info.json
            browser/current.json

