name: Browser simulator

on:
  push:
  pull_request:
  schedule:
    # The build scripts resolve the latest main commit of every configured
    # Playground fork. Poll frequently so a fork-only commit reaches
    # try.clavastack.com without requiring a no-op commit here.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fork-sync:
    name: Check configured fork heads
    concurrency:
      group: fork-sync
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Compare fork heads with the live pointers
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SITE_ORIGIN: https://try.clavastack.com
        shell: bash
        run: |
          set -euo pipefail

          # Pushes, pull requests and manual runs must always validate the
          # checked-out try-clavastack code. Scheduled runs only need the
          # expensive build when one of the upstream forks moved.
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A full build takes longer than five minutes. Do not queue or
          # restart another scheduled build while one is already running.
          active_run="$(gh run list --repo "$REPOSITORY" --workflow browser.yml \
            --status in_progress --json databaseId --jq '.[].databaseId' \
            | awk -v current="$RUN_ID" '$1 != current {print; exit}')"
          if [[ -n "$active_run" ]]; then
            echo "A browser build is already running ($active_run); skipping this poll"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=false
          check_fork() {
            local repository="$1"
            local branch="$2"
            local pointer_path="$3"
            local source_sha
            local pointer

            source_sha="$(git ls-remote "https://github.com/$repository.git" "refs/heads/$branch" | awk 'NR == 1 {print $1}')"
            if [[ -z "$source_sha" ]]; then
              echo "Could not resolve $repository:$branch; forcing a build" >&2
              changed=true
              return
            fi
            pointer="$(curl --fail --silent --show-error --location --retry 3 \
              "$SITE_ORIGIN$pointer_path" | jq -r '.build')"
            if [[ "$pointer" != *"/${source_sha}/"* ]]; then
              echo "$repository changed: live=$pointer latest=$source_sha"
              changed=true
            else
              echo "$repository unchanged at $source_sha"
            fi
          }

          check_fork cryptoadvance/specter-diy master /browser/current.json
          check_fork k9ert/specter-playground main /browser/variants/specter-playground.json
          check_fork schnuartz-ai/specter-playground main /browser/variants/specter-playground-fast.json
          check_fork Schnuartz/specter-playground main /browser/variants/specter-playground-schnuartz.json
          check_fork schnuartz-ai/specter-playground-schnuartz main /browser/variants/specter-playground-schnuartz-alternative.json
          echo "changed=$changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  browser:
    needs: fork-sync
    if: needs.fork-sync.outputs.changed == 'true'
    concurrency:
      # A push or manual run supersedes an older build, but scheduled polls
      # never reach this job while a build is already active.
      group: browser-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build and test Virtual Host integration bridge
        run: |
          go test ./virtual-host
          go build -trimpath -ldflags "-s -w -X main.version=1.0.4" \
            -o /tmp/clavastack-virtual-host ./virtual-host
      - name: Install Emscripten 3.1.74
        run: |
          git clone https://github.com/emscripten-core/emsdk.git .browser-work/emsdk
          .browser-work/emsdk/emsdk install 3.1.74
          .browser-work/emsdk/emsdk activate 3.1.74
      - name: Build real Specter/LVGL browser runtime
        run: bash browser/build-browser.sh
      - name: Build Playground firmware variants
        run: |
          bash browser/build-playground.sh k9ert
          bash browser/build-playground.sh play-fast
          bash browser/build-playground.sh schnuartz
          bash browser/build-playground.sh schnuartz-alternative
      - name: Verify versioned static artifacts
        run: python3 browser/verify-build.py
      - name: Install Specter native test dependencies
        run: |
          pip install -r .browser-work/specter-diy/requirements.txt -r .browser-work/specter-diy/test/integration/requirements.txt
      - name: Run Specter native unit tests
        working-directory: .browser-work/specter-diy/test
        run: python3 run_native_tests.py
      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/specter-static.log 2>&1 &
      - name: Test PC Virtual Host through the real firmware USB shim
        run: |
          /tmp/clavastack-virtual-host --site http://127.0.0.1:8765 --no-open > /tmp/virtual-host.log 2>&1 &
          npm run test:virtual-host
      - name: Check real firmware with Android-sized native worker stacks
        run: npm run test:native-stack
      - name: Run browser, SD and QR smoke tests
        env:
          CI: 'true'
        run: npm run test:browser
      - name: Package the complete tested production site
        if: github.event_name != 'pull_request'
        run: bash deploy/package-site.sh dist
      - name: Upload complete production site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-release
          compression-level: 0
          path: |
            dist/site-release-${{ github.run_id }}.tar.gz
            dist/site-release-${{ github.run_id }}.tar.gz.sha256
      - name: Upload screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: |
            test-results/*.png
            builds/**/build-info.json
      - name: Upload tested browser builds
        # Keep failed-run builds available for startup diagnostics. They are
        # never deployed automatically; deployment still requires a green run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-builds
          compression-level: 0
          path: |
            builds/**/*.js
            builds/**/*.wasm
            builds/**/*.data
            builds/**/build-info.json
            browser/current.json
            browser/variants/*.json

  release:
    name: Publish tested site release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested site package
        uses: actions/download-artifact@v4
        with:
          name: site-release
          path: dist
      - name: Publish immutable assets on the production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view production --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create production \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Production deployments" \
              --notes "Tested deployment packages consumed by try.clavastack.com."
          fi
          gh release upload production \
            "dist/site-release-${GITHUB_RUN_ID}.tar.gz" \
            "dist/site-release-${GITHUB_RUN_ID}.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY"
          gh release edit production \
            --repo "$GITHUB_REPOSITORY" \
            --latest \
            --notes "Latest tested deployment: run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}."
