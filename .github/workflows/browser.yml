name: Browser simulator

on:
  push:
  pull_request:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Emscripten 3.1.74
        run: |
          git clone https://github.com/emscripten-core/emsdk.git .browser-work/emsdk
          .browser-work/emsdk/emsdk install 3.1.74
          .browser-work/emsdk/emsdk activate 3.1.74
      - name: Build real Specter/LVGL browser runtime
        run: bash browser/build-browser.sh
      - name: Build Playground firmware variants
        run: |
          bash browser/build-playground.sh k9ert
          bash browser/build-playground.sh schnuartz
      - name: Verify versioned static artifacts
        run: python3 browser/verify-build.py
      - name: Install Specter native test dependencies
        run: |
          pip install -r .browser-work/specter-diy/requirements.txt -r .browser-work/specter-diy/test/integration/requirements.txt
      - name: Run Specter native unit tests
        working-directory: .browser-work/specter-diy/test
        run: python3 run_native_tests.py
      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/specter-static.log 2>&1 &
      - name: Check real firmware with Android-sized native worker stacks
        run: npm run test:native-stack
      - name: Run browser, SD and QR smoke tests
        env:
          CI: 'true'
        run: npm run test:browser
      - name: Upload screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: |
            test-results/*.png
            builds/**/build-info.json
      - name: Upload tested browser builds
        # Keep failed-run builds available for startup diagnostics. They are
        # never deployed automatically; deployment still requires a green run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-builds
          compression-level: 0
          path: |
            builds/**/*.js
            builds/**/*.wasm
            builds/**/*.data
            builds/**/build-info.json
            browser/current.json
            browser/variants/*.json
